name: Keep simulator awake

on:
  schedule:
    # Streamlit Community Cloud sleeps an app after a period of inactivity.
    # A ping every 10 minutes keeps it warm so a cold client link never hits
    # the "Zzzz" wake-up screen.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: |
          # Don't follow redirects: Streamlit's own redirect chain needs a
          # cookie jar to terminate, and curl -L without one loops until it
          # hits --max-redirs and exits 47 (a false failure, not a dead app).
          # A bare hit to the origin is enough to register as activity.
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            https://namaste-rental.streamlit.app)
          echo "status: $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 500 ]; then
            echo "::error::unexpected status $code"
            exit 1
          fi
