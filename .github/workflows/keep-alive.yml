name: Keep simulator awake

on:
  schedule:
    # Streamlit Community Cloud sleeps an app after a period of inactivity.
    # A ping every 10 minutes keeps it warm so a cold client link never hits
    # the "Zzzz" wake-up screen.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: |
          curl -sL -o /dev/null -w "status: %{http_code}\n" \
            https://namaste-rental.streamlit.app
